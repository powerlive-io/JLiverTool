name: Release

on:
  push:
    tags: "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build release
        run: cargo build --release --locked -p jlivertool

      - name: Package
        run: cargo packager --release -p jlivertool

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            target/release/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build release
        run: cargo build --release --locked -p jlivertool

      - name: Package
        run: cargo packager --release -p jlivertool

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            target/release/*.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo bash linux/install-build-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build release
        run: cargo build --release --locked -p jlivertool

      - name: Package deb
        run: cargo packager --release -p jlivertool --formats deb

      - name: Package AppImage
        run: cargo packager --release -p jlivertool --formats appimage

      - name: Generate PKGBUILD for Arch Linux
        run: cargo packager --release -p jlivertool --formats pacman

      - name: Patch PKGBUILD for Arch libxdo.so.4 ABI
        run: |
          sed -i '/^options=/a makedepends=(patchelf)' target/release/PKGBUILD
          sed -i '/cp -r.*srcdir.*pkgdir/a\patchelf --replace-needed libxdo.so.3 libxdo.so.4 "${pkgdir}"/usr/bin/jlivertool' target/release/PKGBUILD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/release/*.deb
            target/release/*.AppImage
            target/release/PKGBUILD
            target/release/*_x86_64.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/**/*.dmg,artifacts/**/*.exe,artifacts/**/*.deb,artifacts/**/*.AppImage,artifacts/**/PKGBUILD,artifacts/**/*_x86_64.tar.gz"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          # Release notes are curated manually alongside docs/changelog.mdx.
          generateReleaseNotes: false
